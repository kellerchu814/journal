function openCoverPicker(){
  const y=calY,m=calM,k=ym(y,m);S.settings.covers=S.settings.covers||{};
  let cfg=coverCfg(y,m),artTab=cfg.art.t==='img'?'img':'g';
  const s=openSheet({title:`${m+1}月封面`,full:true,onClose:()=>{if(cur==='cal')renders.cal()}});
  const B=s.body;
  const commit=next=>{
    const old=cfg.art;cfg=Object.assign({},cfg,next);
    if(old.t==='img'&&!(cfg.art.t==='img'&&cfg.art.id===old.id))dropBlob(old.id);
    S.settings.covers[k]={layout:cfg.layout,art:cfg.art,bw:cfg.bw};save('settings');draw();
  };
  const sw=i=>`<button class="cp-sw ${cfg.art.t==='g'&&cfg.art.i===i?'on':''}" data-g="${i}" style="background:${COVERS[i]}"><span>${GRADS[i][0]}</span></button>`;
  const draw=()=>{
    B.innerHTML=`<div class="cp-preview">${coverHTML(y,m,cfg.layout)}</div>
      <div class="sec-h"><h2>版型</h2><button class="pill" data-all>${icon('repeat')}套用到每個月</button></div>
      <div class="cp-layouts noswipe">${LAYOUTS.map(([id,l])=>`<button class="cp-l ${cfg.layout===id?'on':''}" data-l="${id}">${coverHTML(y,m,id)}<span>${l}</span></button>`).join('')}</div>
      <div class="sec-h mt"><h2>素材</h2><div class="bw-toggle"><span>黑白</span><button type="button" class="switch ${cfg.bw?'on':''}" data-bw role="switch" aria-checked="${cfg.bw}" aria-label="黑白"></button></div></div>
      <div class="wtabs">${[['g','漸層'],['img','照片']].map(([t,l])=>`<button class="${artTab===t?'on':''}" data-tab="${t}">${l}</button>`).join('')}</div>
      ${artTab==='g'?`<div class="cp-grid">${COVERS.map((_,i)=>sw(i)).join('')}</div>`
       :`<div class="cp-photo"><p class="hint">用自己的照片當封面，上傳後可以裁剪範圍。</p><label class="btn btn-p btn-block">${icon('upload')}${cfg.art.t==='img'?'換一張照片':'上傳照片'}<input type="file" accept="image/*" hidden id="cvIn"></label></div>`}
      <button class="btn btn-g btn-block mt" data-reset>恢復預設</button>`;
    paintCover($('.cp-preview',B),cfg,m);$$('.cp-l',B).forEach(l=>paintCover(l,cfg,m));
    requestAnimationFrame(()=>fitCover(B));
    const fi=$('#cvIn',B);
    if(fi)fi.onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
      const a=$('.cp-preview .cv-art',B),ar=a&&a.clientHeight?a.clientWidth/a.clientHeight:5/7;
      const b=await cropImage(f,{aspect:ar,max:1800,title:'裁剪封面'});if(!b)return;
      const id='cov_'+uid();await DB.put('blobs',id,b);commit({art:{t:'img',id}})};
  };
  B.onclick=e=>{
    const L=e.target.closest('[data-l]');if(L){commit({layout:L.dataset.l});return}
    const tb=e.target.closest('[data-tab]');if(tb){artTab=tb.dataset.tab;draw();return}
    const g=e.target.closest('[data-g]');if(g){commit({art:{t:'g',i:+g.dataset.g}});return}
    if(e.target.closest('[data-bw]')){commit({bw:!cfg.bw});return}
    if(e.target.closest('[data-all]')){
      S.settings.coverLayout=cfg.layout;for(const key in S.settings.covers)delete S.settings.covers[key].layout;
      save('settings');toast(`每個月都改用「${LAYOUTS.find(x=>x[0]===cfg.layout)[1]}」版型`);return}

function toggleHabit(k,id){const a=S.habitLog[k]||(S.habitLog[k]=[]);const i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id);if(!a.length)delete S.habitLog[k];save('habitLog')}
function streak(id){let n=0,k=todayStr();if(!(S.habitLog[k]||[]).includes(id))k=addDays(k,-1);while((S.habitLog[k]||[]).includes(id)){n++;k=addDays(k,-1)}return n}

function renderHabits(){
  const box=$('#habitBox');if(!box)return;
  if(!S.habits.length){box.innerHTML=`<div class="empty sm">${icon('repeat')}<p>建立第一個想養成的習慣</p><button class="btn btn-g" data-h="add">${icon('plus')}新增習慣</button></div>`;box.onclick=e=>{if(e.target.closest('[data-h="add"]'))openHabitForm()};return}
  if(calHabit!=='all'&&!S.habits.find(h=>h.id===calHabit))calHabit='all';
  const dim=daysIn(calY,calM),t=todayStr(),mk=ym(calY,calM),elapsed=elapsedDays(calY,calM);
  const startW=new Date(calY,calM,1).getDay();
  const hb=S.habits.find(h=>h.id===calHabit);
  let head;
  if(hb){
    let c=0;for(let d=1;d<=elapsed;d++)if((S.habitLog[`${mk}-${pad(d)}`]||[]).includes(hb.id))c++;
    head=`<div class="hb-head"><div><div class="hb-name">${esc(hb.name)}</div><div class="hb-stat"><b>${c}</b>/ ${elapsed} 天 · 連續 ${streak(hb.id)} 天</div></div><button class="ibtn sm" data-h="edit" aria-label="編輯習慣">${icon('edit')}</button></div>`;
  }else{
    const td=(S.habitLog[t]||[]).filter(id=>S.habits.some(h=>h.id===id)).length;
    head=`<div class="hb-head"><div><div class="hb-name">全部習慣</div><div class="hb-stat">今天完成 <b>${td}</b>/ ${S.habits.length}</div></div><span class="hint">顏色越深完成越多</span></div>`;
  }
  let g='';for(let i=0;i<startW;i++)g+='<span></span>';
  for(let d=1;d<=dim;d++){
    const k=`${mk}-${pad(d)}`,done=S.habitLog[k]||[],fut=k>t;
    let cls='hb-d'+(k===t?' today':'')+(fut?' future':''),st='';
    if(hb){if(done.includes(hb.id)){cls+=' on';st=`--hc:${hb.color}`}}
    else{const fr=done.filter(id=>S.habits.some(h=>h.id===id)).length/S.habits.length;if(fr>0){st=`background:rgba(181,114,74,${(.18+.82*fr).toFixed(2)});color:${fr>.45?'#fff':'var(--ink)'}`}}
    g+=`<button class="${cls}" style="${st}" data-h="day" data-k="${k}">${d}</button>`;
  }
  box.innerHTML=`<div class="chips noswipe"><button class="chip ${!hb?'on':''}" data-h="sel" data-id="all">全部</button>${S.habits.map(h=>`<button class="chip ${calHabit===h.id?'on':''}" data-h="sel" data-id="${h.id}"><span class="dot" style="background:${h.color}"></span>${esc(h.name)}</button>`).join('')}</div>
    ${head}<div class="hb-week">${WD.map(w=>`<span>${w}</span>`).join('')}</div><div class="hb-grid">${g}</div>`;
  box.onclick=e=>{
    const b=e.target.closest('[data-h]');if(!b)return;const a=b.dataset.h;
    if(a==='sel'){calHabit=b.dataset.id;renderHabits()}
    else if(a==='day'){if(hb){toggleHabit(b.dataset.k,hb.id);renderHabits()}else openHabitDay(b.dataset.k)}
    else if(a==='edit')openHabitForm(hb);
    else if(a==='add')openHabitForm();
  };
}

function openHabitDay(k){

/* Google Calendar 風格 24 小時全覽 */
function openDayView(date){
  const H=56;
  const s=openSheet({title:`${fmtDate(date)} ${wd(date)} · 全天`,full:true,headRight:`<button class="ibtn sm acc" data-add aria-label="新增事項">${icon('plus')}</button>`});
  const draw=()=>{
    const evs=eventsOn(date),all=evs.filter(e=>e.allDay);
    const timed=evs.filter(e=>!e.allDay).map(e=>{const st=toMin(e.start);return{e,s:st,en:Math.max(toMin(e.end),st+20)}}).sort((a,b)=>a.s-b.s||b.en-a.en);
    // 重疊事項分欄並排
    const clusters=[];let grp=[],gEnd=-1;
    for(const it of timed){if(grp.length&&it.s>=gEnd){clusters.push(grp);grp=[];gEnd=-1}grp.push(it);gEnd=Math.max(gEnd,it.en)}
    if(grp.length)clusters.push(grp);
    for(const c of clusters){const cols=[];for(const it of c){let i=cols.findIndex(end=>end<=it.s);if(i<0){i=cols.length;cols.push(0)}cols[i]=it.en;it.col=i}c.forEach(it=>it.n=cols.length)}
    let hrs='';for(let h=0;h<24;h++)hrs+=`<div class="dv-h" style="top:${h*H}px"><span>${h===0?'':pad(h)+':00'}</span></div>`;
    const items=timed.map(it=>`<button class="dv-ev" data-id="${it.e.id}" style="top:${it.s/60*H+1}px;height:${Math.max((it.en-it.s)/60*H-2,22)}px;left:calc(${it.col/it.n*100}% + 2px);width:calc(${100/it.n}% - 4px);background:${it.e.color}"><b>${esc(it.e.title)}</b><small>${it.e.start}–${it.e.end}${it.e.location?' · '+esc(it.e.location):''}</small></button>`).join('');
    const now=new Date();const nowLine=date===todayStr()?`<div class="dv-now" style="top:${(now.getHours()*60+now.getMinutes())/60*H}px"></div>`:'';
    s.body.innerHTML=`${all.length?`<div class="dv-all">${all.map(e=>`<button data-id="${e.id}" style="background:${e.color}">${esc(e.title)}</button>`).join('')}</div>`:''}
      <div class="dv" style="height:${24*H}px">${hrs}<div class="dv-grid">${items}</div>${nowLine}</div><p class="hint center" style="margin-top:14px">點空白時段可快速新增</p>`;
  };
  s.body.onclick=e=>{
    const b=e.target.closest('[data-id]');if(b){openEventForm(date,S.events.find(x=>x.id===b.dataset.id),draw);return}
    const g=e.target.closest('.dv-grid');
    if(g){const y=e.clientY-g.getBoundingClientRect().top;const h=Math.max(0,Math.min(23,Math.floor(y/H)));openEventForm(date,null,draw,{start:`${pad(h)}:00`,end:h<23?`${pad(h+1)}:00`:'23:59'})}
  };
  $('[data-add]',s.el).onclick=()=>openEventForm(date,null,draw);
  draw();
  const evs=eventsOn(date).filter(e=>!e.allDay);
  const focus=date===todayStr()?new Date().getHours()*60:(evs.length?toMin(evs[0].start):8*60);
  requestAnimationFrame(()=>{s.body.scrollTop=Math.max(0,(focus-60)/60*H)});
}

async function renderImgs(toEnd){

function compressImg(file,max=1600,q=.85){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(url);
    c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q)};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};
  im.src=url;
})}
/* 圖片裁剪：拖曳移動、雙指 / 滾輪 / 拉桿縮放，輸出 JPEG Blob（取消回傳 null） */
const CROP_RATIOS=[['原圖',null],['1:1',1],['4:5',4/5],['3:4',3/4],['16:9',16/9]];
function cropImage(src,{aspect=null,aspects=null,circle=false,max=1600,title='裁剪圖片',allowOriginal=false}={}){
  return new Promise(async res=>{
    const own=typeof src!=='string',url=own?URL.createObjectURL(src):src;
    const im=new Image();im.src=url;
    try{await im.decode()}catch(e){if(own)URL.revokeObjectURL(url);toast('圖片無法讀取');res(null);return}
    const nat={w:im.naturalWidth,h:im.naturalHeight};
    let ai=0,ar=aspects?(aspects[0][1]||nat.w/nat.h):(aspect||nat.w/nat.h),done=false;
    const s=openSheet({title,full:true,onClose:()=>{if(!done)res(null);if(own)setTimeout(()=>URL.revokeObjectURL(url),500)}});
    s.body.innerHTML=`<div class="crop-wrap"><div class="crop-stage noswipe ${circle?'circle':''}"><img alt="" draggable="false"></div></div>
      ${aspects?`<div class="chips crop-ar noswipe">${aspects.map(([l],i)=>`<button class="chip ${i===0?'on':''}" data-ar="${i}">${l}</button>`).join('')}</div>`:''}
      <div class="crop-zoom">${icon('image')}<input type="range" class="range noswipe" min="1" max="4" step="0.01" value="1" aria-label="縮放">${icon('expand')}</div>
      <p class="hint center" style="margin-top:6px">拖曳移動，雙指或拉桿縮放</p>
      <div class="row mt">${allowOriginal?'<button class="btn btn-g" data-orig>使用原圖</button>':'<button class="btn btn-g" data-cancel>取消</button>'}<button class="btn btn-p" data-ok>${icon('check')}完成</button></div>`;
    const stage=$('.crop-stage',s.body),img=$('img',stage),zr=$('.crop-zoom input',s.body);
    img.src=url;img.style.width=nat.w+'px';img.style.height=nat.h+'px';
    let fw=1,fh=1,base=1,z=1,x=0,y=0;
    const clamp=()=>{const sc=base*z;x=Math.min(0,Math.max(fw-nat.w*sc,x));y=Math.min(0,Math.max(fh-nat.h*sc,y))};
    const apply=()=>{clamp();img.style.transform=`translate(${x}px,${y}px) scale(${base*z})`;zr.value=z;setRangeP(zr)};
    const layout=()=>{
      const maxW=Math.min(s.body.clientWidth-32,520),maxH=innerHeight*.52;let w=maxW,h=w/ar;if(h>maxH){h=maxH;w=h*ar}
      fw=w;fh=h;stage.style.width=w+'px';stage.style.height=h+'px';
      base=Math.max(fw/nat.w,fh/nat.h);z=1;x=(fw-nat.w*base)/2;y=(fh-nat.h*base)/2;apply();
    };
    const zoomAt=(nz,cx,cy)=>{nz=Math.min(4,Math.max(1,nz));const k=nz/z;x=cx-(cx-x)*k;y=cy-(cy-y)*k;z=nz;apply()};
    const pts=new Map();let pinch=null;
    stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});pinch=null});
    stage.addEventListener('pointermove',e=>{
      const p=pts.get(e.pointerId);if(!p)return;
      if(pts.size===1){x+=e.clientX-p.x;y+=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;apply();return}
      p.x=e.clientX;p.y=e.clientY;const[a,b]=[...pts.values()],r=stage.getBoundingClientRect();
      const dist=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2-r.left,cy=(a.y+b.y)/2-r.top;
      if(pinch){zoomAt(z*dist/pinch.d,cx,cy);x+=cx-pinch.cx;y+=cy-pinch.cy;apply()}
      pinch={d:dist,cx,cy};
    });
    const up=e=>{pts.delete(e.pointerId);pinch=null};
    stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
    stage.addEventListener('wheel',e=>{e.preventDefault();const r=stage.getBoundingClientRect();zoomAt(z*(1-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
    zr.oninput=()=>zoomAt(+zr.value,fw/2,fh/2);
    s.body.onclick=async e=>{
      const c=e.target.closest('[data-ar]');
      if(c){ai=+c.dataset.ar;ar=aspects[ai][1]||nat.w/nat.h;$$('[data-ar]',s.body).forEach(b=>b.classList.toggle('on',b===c));layout();return}
      if(e.target.closest('[data-cancel]')){s.close();return}
      if(e.target.closest('[data-orig]')){try{const b=await compressImg(src,max);done=true;res(b)}catch(err){toast('圖片無法讀取');done=true;res(null)}s.close();return}
      if(e.target.closest('[data-ok]')){
        const sc=base*z,sw=fw/sc,sh=fh/sc,ow=Math.round(Math.min(max,sw,max*ar)),oh=Math.round(ow/ar);
        const cv=document.createElement('canvas');cv.width=ow;cv.height=oh;
        const g=cv.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(im,-x/sc,-y/sc,sw,sh,0,0,ow,oh);
        cv.toBlob(b=>{done=true;res(b);s.close()},'image/jpeg',.88);
      }
    };
    requestAnimationFrame(()=>requestAnimationFrame(layout));
  });
}
async function recropImage(id){
  const u=await blobUrl(id);if(!u)return;
  const b=await cropImage(u,{aspects:CROP_RATIOS,title:'裁剪圖片'});if(!b)return;
  await DB.put('blobs',id,b);if(urlCache[id]){URL.revokeObjectURL(urlCache[id]);delete urlCache[id]}
  renderImgs();toast('已更新圖片');
}

function openViewer(ids,idx,opts={}){
  const v=document.createElement('div');v.className='viewer';
  v.innerHTML=`<div class="v-count"></div>${opts.onCrop?`<button class="v-crop">${icon('crop')}裁剪</button>`:''}<button class="v-close" aria-label="關閉">${icon('x')}</button><img class="v-img" alt="">`;
  document.body.append(v);lockScroll(1);
  const img=$('.v-img',v),cnt=$('.v-count',v);
  const show=async()=>{img.style.transform='';img.src=await blobUrl(ids[idx]);cnt.textContent=ids.length>1?`${idx+1} / ${ids.length}`:''};
  const kd=e=>{if(e.key==='Escape')close();else if(e.key==='ArrowRight'&&idx<ids.length-1){idx++;show()}else if(e.key==='ArrowLeft'&&idx>0){idx--;show()}};
  const close=()=>{v.classList.remove('show');setTimeout(()=>v.remove(),250);lockScroll(-1);document.removeEventListener('keydown',kd)};
  document.addEventListener('keydown',kd);
  let x0=null,y0=0,dx=0,dy=0;
  v.addEventListener('touchstart',e=>{if(e.touches.length>1||e.target.closest('button')){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=dy=0;img.style.transition='none'},{passive:true});
  v.addEventListener('touchmove',e=>{e.preventDefault();if(x0==null)return;dx=e.touches[0].clientX-x0;dy=e.touches[0].clientY-y0;
    if(Math.abs(dy)>Math.abs(dx)){const p=Math.max(0,dy);img.style.transform=`translateY(${p}px) scale(${1-Math.min(.25,p/1200)})`;v.style.background=`rgba(20,14,10,${(.94-Math.min(.6,p/450)).toFixed(2)})`}
    else img.style.transform=`translateX(${dx}px)`},{passive:false});
  v.addEventListener('touchend',()=>{if(x0==null)return;x0=null;img.style.transition='';v.style.background='';
    if(dy>110&&Math.abs(dy)>Math.abs(dx)){close();return}
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){const n=idx+(dx<0?1:-1);if(n>=0&&n<ids.length){idx=n;show();return}}
    img.style.transform=''});
  v.onclick=e=>{
    if(e.target.closest('.v-crop')){const id=ids[idx];close();opts.onCrop(id);return}
    if(e.target===v||e.target.closest('.v-close'))close();
  };
  requestAnimationFrame(()=>v.classList.add('show'));show();
}


/* =========================================================
   背景音樂：YouTube（含 YouTube Music）/ 本機音檔
   同一個 Mini Player 控制不同來源（PS = 目前播放狀態）
   ========================================================= */
const audio=new Audio();audio.preload='metadata';
let curTrack=null,playCat='全部',musicHook=null;
const PS={kind:null,playing:false,pos:0,dur:0};
const SRC_LABEL={file:'本機音檔',url:'音檔網址',yt:'YouTube'};
const srcOf=t=>t.src||(t.blob?'file':'url');
const kindOf=t=>{const s=srcOf(t);return s==='file'||s==='url'?'audio':s};
const curT=()=>S.music.find(x=>x.id===curTrack);
const trackList=cat=>cat==='全部'?S.music:S.music.filter(t=>t.cat===cat);

function parseMusicUrl(raw){
  raw=(raw||'').trim();
  let u;try{u=new URL(raw)}catch(e){return null}
  if(!/^https?:$/.test(u.protocol))return null;
  const h=u.hostname.replace(/^(www|m)\./,'');
  if(h==='youtu.be'){const vid=u.pathname.slice(1,12);return vid?{src:'yt',vid,list:u.searchParams.get('list')||''}:null}
  if(h==='youtube.com'||h==='music.youtube.com'||h==='youtube-nocookie.com'){
    let vid=u.searchParams.get('v')||'';const m=u.pathname.match(/^\/(shorts|embed|live|v)\/([\w-]{11})/);if(m)vid=m[2];
    const list=u.searchParams.get('list')||'';
    return vid||list?{src:'yt',vid,list}:null;
  }
  return null;
}

/* ---- 外部播放器 ---- */
const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=res;s.onerror=rej;document.head.append(s)});
const YT_={player:null,ready:null,timer:null};
function ytReady(){
  if(YT_.ready)return YT_.ready;
  YT_.ready=new Promise((res,rej)=>{
    window.onYouTubeIframeAPIReady=()=>{
      const vars={playsinline:1,rel:0,modestbranding:1};if(/^https?:/.test(location.protocol))vars.origin=location.origin;
      YT_.player=new YT.Player('ytHost',{width:'100%',height:'100%',playerVars:vars,events:{
        onReady:()=>res(YT_.player),onStateChange:ytState,
        onError:e=>toast(e.data===101||e.data===150?'這部影片不允許在其他網站播放':e.data===100?'找不到這部影片':'YouTube 播放失敗（請用 http/https 開啟手帳）')}});
    };
    loadScript('https://www.youtube.com/iframe_api').catch(()=>{YT_.ready=null;rej(new Error('yt'))});
  });
  return YT_.ready;
}
function ytState(e){
  if(PS.kind!=='yt')return;const p=YT_.player,t=curT();
  if(e.data===1){PS.playing=true;dockHint('');
    const d=p.getVideoData&&p.getVideoData();if(t&&t.autoTitle&&d&&d.title){t.title=d.title;t.autoTitle=false;save('music')}}
  else if(e.data===0){PS.playing=false;
    if(t&&t.list){const pl=p.getPlaylist&&p.getPlaylist();if(pl&&p.getPlaylistIndex()<pl.length-1){updatePlayer();return}}
    nextTrack(1);return}
  else if(e.data!==3)PS.playing=false;
  updatePlayer();
}
function showDock(kind,open=true){
  const d=$('#dock');d.classList.toggle('hide',!kind);d.classList.toggle('min',!open);
  $('#ytWrap').classList.toggle('hide',kind!=='yt');
  if(kind)$('#dockSrc').textContent=SRC_LABEL[kind];
  updateDockBtn();
}
function updateDockBtn(){const d=$('#dock'),b=$('#dockMin');if(b)b.textContent=d.classList.contains('min')?'展開':'收合'}
const dockHint=m=>{const h=$('#dockHint');if(h)h.textContent=m||''};
function stopOthers(k){
  if(k!=='audio'&&!audio.paused)audio.pause();
  if(k!=='yt'&&YT_.player&&YT_.player.pauseVideo)try{YT_.player.pauseVideo()}catch(e){}
  clearInterval(YT_.timer);
}

async function playTrack(id){
  const t=S.music.find(x=>x.id===id);if(!t)return;
  curTrack=id;S.settings.lastTrack=id;save('settings');
  const kind=kindOf(t);
  stopOthers(kind);Object.assign(PS,{kind,playing:false,pos:0,dur:0});updatePlayer();updateProgress();
  try{
    if(kind==='audio'){showDock(null);audio.src=t.blob?await blobUrl(t.blob):t.url;await audio.play()}
    else if(kind==='yt'){
      showDock('yt',true);dockHint('載入中…');const p=await ytReady();
      if(t.vid)p.loadVideoById(t.vid);else p.loadPlaylist({list:t.list,listType:'playlist'});
      YT_.timer=setInterval(()=>{if(PS.kind!=='yt'||!p.getCurrentTime)return;PS.pos=p.getCurrentTime()||0;PS.dur=p.getDuration()||0;updateProgress()},500);
      setTimeout(()=>{if(PS.kind==='yt'&&!PS.playing){showDock('yt',true);dockHint('沒有自動播放？請直接點一下影片')}},1800);
    }
  }catch(e){toast(kind==='audio'?'無法播放這首音樂':'播放器載入失敗，請檢查網路')}
  updatePlayer();
  if('mediaSession' in navigator&&window.MediaMetadata)try{navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.cat,album:'我的手帳',artwork:t.thumb?[{src:t.thumb,sizes:'320x180'}]:[]})}catch(e){}
}
function togglePlay(){
  const t=curT();
  if(!t){const l=trackList(playCat).length?trackList(playCat):S.music;if(l[0])playTrack(l[0].id);else openMusic();return}
  if(!PS.kind||PS.kind!==kindOf(t)||(PS.kind==='audio'&&!audio.getAttribute('src'))){playTrack(t.id);return}
  if(PS.kind==='audio'){if(audio.paused)audio.play().catch(()=>toast('無法播放'));else audio.pause()}
  else if(PS.kind==='yt'&&YT_.player){if(PS.playing)YT_.player.pauseVideo();else{YT_.player.playVideo();setTimeout(()=>{if(!PS.playing){showDock('yt',true);dockHint('請直接點一下影片開始播放')}},1200)}}
}
function nextTrack(dir=1){
  const t=curT();
  if(PS.kind==='yt'&&t&&t.list&&YT_.player){dir>0?YT_.player.nextVideo():YT_.player.previousVideo();return}
  let l=trackList(playCat);if(!l.some(x=>x.id===curTrack))l=S.music;if(!l.length)return;
  let i=l.findIndex(x=>x.id===curTrack);i=(i+dir+l.length)%l.length;playTrack(l[i].id);
}
function seekTo(p){
  const s=p*PS.dur;PS.pos=s;
  if(PS.kind==='audio')audio.currentTime=s;
  else if(PS.kind==='yt'&&YT_.player)YT_.player.seekTo(s,true);
  updateProgress();
}
const fmtT=s=>{if(!isFinite(s)||s<0)return '0:00';s=Math.floor(s);return Math.floor(s/60)+':'+pad(s%60)};
function updateProgress(){
  const p=PS.dur?Math.min(100,PS.pos/PS.dur*100):0;
  $$('.prog-fill').forEach(f=>f.style.width=p+'%');
  $$('.t-cur').forEach(x=>x.textContent=fmtT(PS.pos));
  $$('.t-dur').forEach(x=>x.textContent=fmtT(PS.dur));
}
function updatePlayer(){
  const t=curT();
  $('#plTitle').textContent=t?t.title:'加入你的背景音樂';
  $('#plSub').textContent=t?`${SRC_LABEL[srcOf(t)]} · ${PS.playing?'播放中':PS.kind?'已暫停':'點播放開始'}`:'貼上 YouTube 連結開始';
  $('#plPlay').innerHTML=icon(PS.playing?'pause':'play');
  const disc=$('#plDisc');disc.classList.toggle('spin',PS.playing);disc.classList.toggle('thumb',!!(t&&t.thumb));disc.style.backgroundImage=t&&t.thumb?`url("${t.thumb}")`:'';
  $('#plDock').classList.toggle('hide',!(PS.kind&&PS.kind!=='audio'));
  if('mediaSession' in navigator)try{navigator.mediaSession.playbackState=PS.playing?'playing':'paused'}catch(e){}
  musicHook&&musicHook();
}
audio.addEventListener('play',()=>{if(PS.kind==='audio'){PS.playing=true;updatePlayer()}});
audio.addEventListener('pause',()=>{if(PS.kind==='audio'){PS.playing=false;updatePlayer()}});
audio.addEventListener('timeupdate',()=>{if(PS.kind==='audio'){PS.pos=audio.currentTime;PS.dur=audio.duration||0;updateProgress()}});
audio.addEventListener('ended',()=>{if(PS.kind==='audio')nextTrack(1)});
audio.addEventListener('error',()=>{if(PS.kind==='audio'&&audio.getAttribute('src'))toast('音源載入失敗，請檢查網址或網路')});

// 進度條：點擊或拖曳跳轉
document.addEventListener('pointerdown',e=>{
  const bar=e.target.closest('[data-seek]');if(!bar||!PS.dur)return;e.preventDefault();
  const seek=ev=>{const r=bar.getBoundingClientRect();seekTo(Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width)))};
  seek(e);
  const up=()=>{removeEventListener('pointermove',seek);removeEventListener('pointerup',up);removeEventListener('pointercancel',up)};
  addEventListener('pointermove',seek);addEventListener('pointerup',up);addEventListener('pointercancel',up);
});

/* 自動抓取曲名 / 縮圖 */
async function fetchMeta(t){
  let link=null,ep=null;
  if(t.src==='yt'){link=t.vid?`https://www.youtube.com/watch?v=${t.vid}`:`https://www.youtube.com/playlist?list=${t.list}`;ep=`https://noembed.com/embed?url=${encodeURIComponent(link)}`}
  if(!ep)return;
  try{const j=await(await fetch(ep)).json();let ch=false;
    if(j.title&&t.autoTitle){t.title=j.title;t.autoTitle=false;ch=true}
    if(j.thumbnail_url&&!t.thumb){t.thumb=j.thumbnail_url;ch=true}
    if(ch){save('music');updatePlayer()}
  }catch(e){}

function lineChart(vals,o){
  const W=340,H=o.h||160,pl=o.pl||30,pr=12,pt=14,pb=22,iw=W-pl-pr,ih=H-pt-pb,n=vals.length;
  const X=i=>pl+(n>1?i*iw/(n-1):iw/2),Y=v=>pt+ih-(v-o.min)/(o.max-o.min)*ih;
  const pts=vals.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
  if(!pts.length)return `<div class="empty sm">${icon('chart')}<p>${o.empty||'這個月還沒有紀錄'}</p></div>`;
  const gid='g'+uid();
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'')}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${o.color}" stop-opacity=".22"/><stop offset="1" stop-color="${o.color}" stop-opacity="0"/></linearGradient></defs>`;
  for(const t of o.ticks){const y=Y(t);s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#ece4da"/><text x="${pl-6}" y="${y+3.5}" text-anchor="end">${o.fmt?o.fmt(t):t}</text>`}
  for(const d of [...new Set([1,5,10,15,20,25,n])].filter(d=>d<=n))s+=`<text x="${X(d-1)}" y="${H-5}" text-anchor="middle">${d}</text>`;
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  if(pts.length>1)s+=`<path d="${line}L${pts[pts.length-1][0].toFixed(1)} ${pt+ih}L${pts[0][0].toFixed(1)} ${pt+ih}Z" fill="url(#${gid})"/><path d="${line}" fill="none" stroke="${o.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  for(const p of pts)s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.4" fill="#fffdfa" stroke="${o.color}" stroke-width="2"/>`;
  return s+'</svg>';
}
function hbarChart(rows){
  const W=340,rh=36,lw=80,vw=48,H=rows.length*rh,tw=W-lw-vw;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="習慣完成率">`;
  rows.forEach((r,i)=>{const y=i*rh+rh/2,lab=r.label.length>5?r.label.slice(0,5)+'…':r.label;
    s+=`<text x="0" y="${y+4}" class="lb">${esc(lab)}</text><rect x="${lw}" y="${y-5}" width="${tw}" height="10" rx="5" fill="#f1eae1"/>${r.value>0?`<rect x="${lw}" y="${y-5}" width="${Math.max(10,tw*r.value).toFixed(1)}" height="10" rx="5" fill="${r.color}"/>`:''}<text x="${W}" y="${y+4}" text-anchor="end" class="vl">${Math.round(r.value*100)}%</text>`});
  return s+'</svg>';
}
function radarChart(vals,labels,max=10){
  const W=320,H=268,cx=160,cy=136,R=88,N=labels.length;
  const ang=i=>(-90+i*360/N)*Math.PI/180,Pt=(i,r)=>[cx+Math.cos(ang(i))*r,cy+Math.sin(ang(i))*r];
  const poly=f=>[...Array(N).keys()].map(i=>Pt(i,f(i)).map(v=>v.toFixed(1)).join(',')).join(' ');
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="固執雷達圖">`;
  for(const lv of [2,4,6,8,10])s+=`<polygon points="${poly(()=>R*lv/max)}" fill="${lv===10?'#fbf6f0':'none'}" stroke="#e8dfd4"/>`;
  for(let i=0;i<N;i++){const[x,y]=Pt(i,R);s+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e8dfd4"/>`}
  s+=`<polygon points="${poly(i=>R*vals[i]/max)}" fill="rgba(181,114,74,.2)" stroke="#b5724a" stroke-width="2" stroke-linejoin="round"/>`;
  for(let i=0;i<N;i++){const[x,y]=Pt(i,R*vals[i]/max);s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="#b5724a"/>`}
  for(let i=0;i<N;i++){const[x,y]=Pt(i,R+18),c=Math.cos(ang(i));const an=c>.3?'start':c<-.3?'end':'middle';const dy=Math.sin(ang(i))<-.9?-4:Math.sin(ang(i))>.3?12:4;
    s+=`<text x="${x.toFixed(1)}" y="${(y+dy).toFixed(1)}" text-anchor="${an}" class="rl">${esc(labels[i])} <tspan class="rv">${vals[i]}</tspan></text>`}
  return s+'</svg>';
}

function yrCal(o,box){

  for(let m=0;m<12;m++){
    const sw=new Date(yearY,m,1).getDay(),dim=daysIn(yearY,m),mk=ym(yearY,m);

    h+=`<button class="mm ${t.startsWith(mk)?'cur':''}" data-m="${m}"><div class="mm-h"><b>${m+1}月</b><small>${cnt?cnt+' 件事':''}</small></div><div class="mm-g">${g}</div></button>`;

let valEdit=false;
function getValueList(){
  if(!S.settings.valueList){const c=S.settings.customValues||[];S.settings.valueList=[...VALUES,...c.filter(v=>!VALUES.includes(v))]}
  return S.settings.valueList;

function renameValueEverywhere(from,to){for(const y in S.yearly){const v=S.yearly[y].values;if(v){const i=v.indexOf(from);if(i>=0){if(to&&!v.includes(to))v[i]=to;else v.splice(i,1)}}}save('yearly')}
function yrMe(o,box){
  const list=getValueList();
  const rerender=()=>{const y=scrollY;yrMe(o,box);scrollTo(0,y)};
  box.innerHTML=`<section class="sec" style="margin-top:18px"><div class="sec-h"><h2>${icon('user')}我想成為的人</h2></div><p class="hint" style="margin:-4px 2px 12px">慢慢回答，不需要完美。答案可以隨時改。</p>

    <section class="sec"><div class="sec-h"><h2>${icon('grid')}核心價值觀</h2><button class="pill" data-ve>${icon(valEdit?'check':'edit')}${valEdit?'完成':'編輯'}</button></div>

    <form class="le-add" id="vAdd"><input class="inp" placeholder="新增價值，例如：溫柔" maxlength="8"><button class="ibtn" type="submit" aria-label="新增">${icon('plus')}</button></form>
    ${o.values.length?`<div class="card mt"><span class="label">我的核心價值</span><div class="my-values">${o.values.map(v=>`<span>${esc(v)}</span>`).join('')}</div></div>`:''}</section>`;
  bindFields($('#qBox',box),o.answers,'yearly');
  box.onclick=e=>{
    if(e.target.closest('[data-ve]')){valEdit=!valEdit;rerender();return}
    const d=e.target.closest('[data-vdel]');
    if(d){const v=d.dataset.vdel,i=list.indexOf(v);list.splice(i,1);save('settings');
      const had={};for(const y in S.yearly){const a=S.yearly[y].values;if(a&&a.includes(v))had[y]=a.indexOf(v)}
      renameValueEverywhere(v,null);rerender();
      toast(`已刪除「${v}」`,()=>{list.splice(i,0,v);for(const y in had)S.yearly[y].values.splice(had[y],0,v);save('settings');save('yearly');rerender()});return}
    const b=e.target.closest('[data-v]');if(!b)return;const v=b.dataset.v;
    if(valEdit){
      const s=openSheet({title:'修改價值',body:`<div class="field"><input class="inp" id="vName" maxlength="8"></div><button class="btn btn-p btn-block" data-save>${icon('check')}儲存</button>`});

      s.body.onclick=ev=>{if(!ev.target.closest('[data-save]'))return;const nv=inp.value.trim();if(!nv){toast('名稱不能空白');return}
        if(nv!==v&&list.includes(nv)){toast('已經有這個價值了');return}
        list[list.indexOf(v)]=nv;save('settings');renameValueEverywhere(v,nv);s.close();rerender()};
      return}
    const i=o.values.indexOf(v);
    if(i>=0)o.values.splice(i,1);else if(o.values.length>=5){toast('最多選 5 個，先取消一個吧');return}else o.values.push(v);
    save('yearly');rerender();
  };
  $('#vAdd',box).onsubmit=e=>{e.preventDefault();const v=$('input',e.target).value.trim();if(!v)return;
    if(list.includes(v)){toast('已經有這個價值了');return}
    list.push(v);save('settings');rerender()};
}

function yrGoal(o,box){
  const planCard=p=>{
    const tot=p.items.length,dn=p.items.filter(x=>x.done).length,pct=tot?Math.round(dn/tot*100):0,open=openPlans.has(p.id);
    const nm=new Date().getMonth()+1,live=yearY===new Date().getFullYear()&&nm>=p.fromM&&nm<=p.toM;
    return `<div class="card plan ${open?'open':''}" data-pid="${p.id}">
      <div class="plan-h" data-p="toggle"><div class="plan-t"><b>${esc(p.name)}</b><span class="badge ${live?'live':''}">${icon('cal')}${p.fromM===p.toM?`${p.fromM}月`:`${p.fromM}月–${p.toM}月`}${live?' · 進行中':''}</span></div><div class="plan-pct">${pct}%</div></div>
      <div class="pbar"><i style="width:${pct}%"></i></div>
      <div class="plan-sub" data-p="toggle"><span>${tot?`${dn} / ${tot} 子項目完成`:'尚未新增子項目'}</span>${icon('chevD')}</div>
      ${open?`<div class="plan-items">${p.items.map((it,i)=>`<div class="pi ${it.done?'done':''}"><button class="pdot" data-p="tog" data-i="${i}" aria-label="完成">${icon('check')}</button><span class="pi-t">${esc(it.text)}</span><button class="del" data-p="delItem" data-i="${i}" aria-label="刪除">${icon('trash')}</button></div>`).join('')}
        <form class="le-add" data-pform><input class="inp" placeholder="新增子項目…" enterkeyhint="done"><button class="ibtn" type="submit" aria-label="新增">${icon('plus')}</button></form>
        <div class="plan-act"><button class="btn btn-g sm" data-p="edit">${icon('edit')}編輯</button><button class="btn btn-d sm" data-p="del">${icon('trash')}刪除計劃</button></div></div>`:''}
    </div>`;
  };
  const draw=()=>{
    const big=o.plans.filter(p=>p.size==='big'),small=o.plans.filter(p=>p.size!=='big');
    $('#plans',box).innerHTML=`
      <section class="sec"><div class="sec-h"><h2>${icon('flag')}大計劃</h2><button class="pill" data-p="add" data-size="big">${icon('plus')}計劃</button></div>${big.length?big.map(planCard).join(''):`<div class="card empty sm"><p>一年裡最想完成的大事</p></div>`}</section>
      <section class="sec"><div class="sec-h"><h2>${icon('checkSq')}小計劃</h2><button class="pill" data-p="add" data-size="small">${icon('plus')}計劃</button></div>${small.length?small.map(planCard).join(''):`<div class="card empty sm"><p>短期、輕巧的小目標</p></div>`}</section>`;
  };
  box.innerHTML=`<section class="sec" style="margin-top:18px"><div class="sec-h"><h2>${icon('target')}今年目標</h2></div><div class="card"><div class="goal-sum" id="gSum"></div><div id="gList"></div></div></section><div id="plans"></div>`;
  const sum=()=>{const t=o.goals.length,d=o.goals.filter(g=>g.done).length;$('#gSum',box).innerHTML=t?`<div class="pbar"><i style="width:${Math.round(d/t*100)}%"></i></div><b>${d} / ${t}</b>`:''};
  listEditor($('#gList',box),o.goals,'yearly',{check:true,ph:'今年我想…',empty:'寫下今年的目標',onChange:sum});
  draw();
  const plans=$('#plans',box);
  plans.onclick=async e=>{
    const b=e.target.closest('[data-p]');if(!b)return;const a=b.dataset.p;
    if(a==='add'){openPlanForm(o,null,b.dataset.size,draw);return}
    const p=o.plans.find(x=>x.id===b.closest('[data-pid]').dataset.pid);
    if(a==='toggle'){openPlans.has(p.id)?openPlans.delete(p.id):openPlans.add(p.id);draw()}

    else if(a==='del'&&await confirmSheet(`刪除計劃「${p.name}」？`)){o.plans=o.plans.filter(x=>x!==p);save('yearly');draw()}
  };
  plans.onsubmit=e=>{e.preventDefault();const f=e.target.closest('[data-pform]');if(!f)return;const v=$('input',f).value.trim();if(!v)return;
    const pid=f.closest('[data-pid]').dataset.pid;o.plans.find(x=>x.id===pid).items.push({text:v,done:false});save('yearly');draw();

    save('yearly');s.close();onDone();
  };
}

const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const cloudCfg=()=>({url:(SUPABASE_URL||lsGet('techou.sbUrl')||'').trim(),key:(SUPABASE_ANON_KEY||lsGet('techou.sbKey')||'').trim()});
/* 大資料按月份切塊同步，避免兩台裝置改不同天時互相覆蓋 */
const SPLIT={diary:k=>k.slice(0,7),habitLog:k=>k.slice(0,7),monthly:k=>k,yearly:k=>k,memo:k=>k};
const SPLIT_ARR={events:e=>(e.date||'').slice(0,7)};
function hashStr(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^h1>>>16,2246822507)^Math.imul(h2^h2>>>13,3266489909);h2=Math.imul(h2^h2>>>16,2246822507)^Math.imul(h1^h1>>>13,3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
const hashOf=v=>hashStr(JSON.stringify(v==null?null:v));
function idbOpen(name){return new Promise((res,rej)=>{const r=indexedDB.open(name,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('blobs'))d.createObjectStore('blobs')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbDump(name){
  const db=await idbOpen(name);const out={kv:{},blobs:{}};
  for(const st of ['kv','blobs'])await new Promise(res=>{const t=db.transaction(st);const c=t.objectStore(st).openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[st][cur.key]=cur.value;cur.continue()}else res()};c.onerror=()=>res()});
  db.close();return out;
}
const idbDelete=name=>new Promise(r=>{const q=indexedDB.deleteDatabase(name);q.onsuccess=q.onerror=q.onblocked=()=>r()});
let accountHook=null;

const Cloud={
  sb:null,user:null,uid:null,status:'off',err:'',lastSync:null,timer:null,busy:false,again:false,metaDirty:false,
  meta:{h:{},at:{},pulled:null,up:{},del:{}},
  on(){return !!(this.sb&&this.user)},
  async loadMeta(){try{const m=await DB.get('kv','_sync');if(m)this.meta=Object.assign({h:{},at:{},pulled:null,up:{},del:{}},m)}catch(e){}},
  saveMeta(){this.metaDirty=false;return DB.put('kv','_sync',this.meta,true).catch(()=>{})},
  touch(k){if(!this.uid)return;this.meta.at[k]=Date.now();this.metaDirty=true;this.schedule()},
  queueUp(id){if(!this.uid)return;this.meta.up[id]=1;delete this.meta.del[id];this.saveMeta();this.schedule()},
  queueDel(id){if(!this.uid)return;delete this.meta.up[id];this.meta.del[id]=1;this.saveMeta();this.schedule()},
  schedule(ms=2500){if(!this.on())return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.sync(),ms)},
  setStatus(s){this.status=s;const d=$('#syncDot');if(d)d.dataset.s=s;renderTopbar();accountHook&&accountHook()},

  chunks(k){
    const v=S[k];
    if(SPLIT[k]){const o={};for(const ek in v||{}){const c=k+':'+SPLIT[k](ek);(o[c]=o[c]||{})[ek]=v[ek]}for(const c in this.meta.h)if(c.startsWith(k+':')&&!(c in o))o[c]={};return o}
    if(SPLIT_ARR[k]){const o={};for(const it of v||[]){const c=k+':'+SPLIT_ARR[k](it);(o[c]=o[c]||[]).push(it)}for(const c in this.meta.h)if(c.startsWith(k+':')&&!(c in o))o[c]=[];return o}
    return{[k]:v};
  },
  apply(top,c,v){
    const pre=c.slice(top.length+1);
    if(SPLIT[top]){const o=S[top]||(S[top]={});for(const ek of Object.keys(o))if(SPLIT[top](ek)===pre)delete o[ek];Object.assign(o,v||{});return}
    if(SPLIT_ARR[top]){S[top]=(S[top]||[]).filter(it=>SPLIT_ARR[top](it)!==pre).concat(v||[]);return}
    S[top]=v!=null?v:(top==='music'?[]:clone(DEF[top]));
  },
  async pull(){
    const changed=new Set();
    for(;;){
      let q=this.sb.from('kv').select('key,value,updated_at').order('updated_at',{ascending:true}).limit(500);
      if(this.meta.pulled)q=q.gt('updated_at',this.meta.pulled);
      const{data,error}=await q;if(error)throw error;
      for(const r of data){
        const top=r.key.split(':')[0];if(!KEYS.includes(top))continue;
        const local=this.chunks(top)[r.key],lh=hashOf(local),rh=hashOf(r.value);
        if(lh===rh){this.meta.h[r.key]=rh;continue}
        const dirty=this.meta.h[r.key]!==lh;
        if(dirty&&(this.meta.at[top]||0)>Date.parse(r.updated_at))continue; // 本機的修改比較新，稍後上傳
        this.apply(top,r.key,r.value);this.meta.h[r.key]=rh;changed.add(top);
      }
      if(data.length)this.meta.pulled=data[data.length-1].updated_at;
      if(data.length<500)break;
    }
    for(const k of changed)await DB.put('kv',k,S[k]);
    await this.saveMeta();
    return changed;
  },
  async push(){
    const rows=[],hs={};
    for(const k of KEYS){const ch=this.chunks(k);for(const c in ch){const h=hashOf(ch[c]);if(this.meta.h[c]!==h){rows.push({user_id:this.user.id,key:c,value:ch[c]==null?null:ch[c]});hs[c]=h}}}
    for(let i=0;i<rows.length;i+=100){
      const part=rows.slice(i,i+100);const{error}=await this.sb.from('kv').upsert(part,{onConflict:'user_id,key'});if(error)throw error;
      part.forEach(r=>this.meta.h[r.key]=hs[r.key]);await this.saveMeta();
    }
  },
  async syncBlobs(){
    const st=this.sb.storage.from(BUCKET),base=this.user.id+'/';
    const dels=Object.keys(this.meta.del);
    if(dels.length){const{error}=await st.remove(dels.map(id=>base+id));if(error)throw error;dels.forEach(id=>delete this.meta.del[id]);await this.saveMeta()}
    for(const id of Object.keys(this.meta.up)){
      const b=await DB.get('blobs',id);
      if(b){const{error}=await st.upload(base+id,b,{upsert:true,contentType:b.type||'application/octet-stream'});
        if(error){if(/exceed|too large|maximum/i.test(error.message)){toast('有檔案太大無法上傳雲端（上限依 Supabase 設定）')}else throw error}}
      delete this.meta.up[id];await this.saveMeta();
    }
  },
  async fetchBlob(id){
    if(!this.on())return null;
    try{const{data,error}=await this.sb.storage.from(BUCKET).download(this.user.id+'/'+id);if(error||!data)return null;await DB.put('blobs',id,data,true);return data}catch(e){return null}
  },
  async sync(){
    if(!this.on())return;
    if(this.busy){this.again=true;return}
    if(!navigator.onLine){this.setStatus('offline');return}
    this.busy=true;this.setStatus('syncing');
    try{
      await flushAll();
      const ch=await this.pull();await this.push();await this.syncBlobs();
      this.lastSync=Date.now();this.err='';this.setStatus('ok');
      if(ch.size){
        if(ch.has('music'))updatePlayer();
        const a=document.activeElement;
        if(a&&a.matches&&a.matches('input,textarea')&&!a.closest('.sheet'))this.pendingRefresh=true;else refresh();
      }
    }catch(e){this.err=e.message||String(e);this.setStatus('error');console.warn('sync',e)}
    this.busy=false;
    if(this.again){this.again=false;this.schedule(500)}
  },

  async init(){
    this.uid=lsGet('techou.uid');
    await this.loadMeta();
    const c=cloudCfg();
    if(!c.url||!c.key){this.setStatus('unconfigured');return}
    try{
      if(!window.supabase)await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js');
      this.sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    }catch(e){this.err='無法載入雲端服務';this.setStatus(navigator.onLine?'error':'offline');return}
    try{const{data}=await this.sb.auth.getSession();await this.handleSession(data.session)}catch(e){this.err=e.message;this.setStatus('error')}
    this.sb.auth.onAuthStateChange((ev,session)=>{
      if(ev==='PASSWORD_RECOVERY'){openNewPassword();return}
      if(ev==='SIGNED_OUT'){if(!this.loggingOut&&this.uid){this.user=null;this.setStatus('expired')}return}
      setTimeout(()=>this.handleSession(session),0);
    });
    addEventListener('online',()=>this.sync());
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.schedule(300);else if(this.on())this.sync()});
    setInterval(()=>this.sync(),60000);
  },
  async handleSession(session){
    const u=session&&session.user;
    if(u&&u.id!==this.uid){ // 剛登入或換帳號 → 切換到該使用者的資料庫
      if(!this.uid)lsSet('techou.merge','1');
      lsSet('techou.uid',u.id);await flushAll();location.replace(location.href.split('#')[0]);return;
    }
    if(!u){if(this.uid){this.user=null;this.setStatus('expired')}else this.setStatus('guest');return}
    const first=!this.user;this.user=u;
    if(first){
      this.setStatus('ok');
      await this.sync();
      await this.maybeMerge();
      const p=getProfile();
      if(!p.onboarded)openOnboarding();
    }
  },
  async maybeMerge(){
    if(lsGet('techou.merge')!=='1')return;lsSet('techou.merge',null);
    let g;try{g=await idbDump(GUEST_DB)}catch(e){return}
    const has=KEYS.some(k=>{const v=g.kv[k];return v&&(Array.isArray(v)?v.length:Object.keys(v).length)&&k!=='settings'})||Object.keys(g.blobs).length;
    if(!has)return;
    if(!await confirmSheet('這台裝置有登入前寫的手帳資料，要搬進你的帳號嗎？（相同的日期或月份會以這台裝置的內容為準）','搬進帳號'))return;
    toast('搬移資料中…');
    for(const k of KEYS){
      const gv=g.kv[k];if(gv==null)continue;
      if(Array.isArray(gv)){const cur=S[k]||[];S[k]=cur.concat(gv.filter(x=>!cur.some(y=>y.id===x.id)))}
      else if(k==='settings')S[k]=Object.assign({},gv,S[k]);
      else S[k]=Object.assign({},S[k],gv);
      await DB.put('kv',k,S[k]);this.meta.at[k]=Date.now();
    }
    for(const id in g.blobs)await DB.put('blobs',id,g.blobs[id]);
    await this.saveMeta();await idbDelete(GUEST_DB);
    refresh();await this.sync();toast('已搬進你的帳號');
  },
  async wipeCloud(){
    const st=this.sb.storage.from(BUCKET);
    for(;;){const{data,error}=await st.list(this.user.id,{limit:100});if(error)throw error;if(!data||!data.length)break;const{error:e2}=await st.remove(data.map(f=>this.user.id+'/'+f.name));if(e2)throw e2;if(data.length<100)break}
    const{error}=await this.sb.from('kv').delete().eq('user_id',this.user.id);if(error)throw error;
  },
  async leaveDevice(){
    this.loggingOut=true;try{await this.sb.auth.signOut()}catch(e){}
    const name=DB.name;try{DB.db&&DB.db.close()}catch(e){}await idbDelete(name);
    lsSet('techou.uid',null);lsSet('techou.merge',null);location.replace(location.href.split('#')[0]);
  },
  async logout(){
    if(!await confirmSheet('登出後，這台裝置上的帳號資料會移除（雲端仍保留，下次登入會再下載）。確定登出？','登出'))return;
    toast('最後一次同步中…');await this.sync();
    const pending=Object.keys(this.meta.up).length;
    if((this.status!=='ok'||pending)&&!await confirmSheet('還有資料沒有同步到雲端，現在登出會遺失這些修改。仍要登出？','仍要登出'))return;
    await this.leaveDevice();
  },
  async deleteAccount(){
    if(!await confirmSheet('永久刪除帳號，以及雲端上所有日記、照片與音樂？這無法復原。','永久刪除'))return;
    try{toast('刪除中…');await this.wipeCloud();const{error}=await this.sb.rpc('delete_my_account');if(error)throw error;await this.leaveDevice()}
    catch(e){toast('刪除失敗：'+(e.message||e))}
  },
};

/* ---- 個人資料 ---- */
function getProfile(){return S.settings.profile||(S.settings.profile={})}
function displayName(){const p=getProfile(),m=(Cloud.user&&Cloud.user.user_metadata)||{};return p.name||m.name||m.full_name||(Cloud.user&&Cloud.user.email?Cloud.user.email.split('@')[0]:'')||''}
async function avatarHTML(cls=''){
  const p=getProfile(),m=(Cloud.user&&Cloud.user.user_metadata)||{};
  let src='';if(p.avatar)src=await blobUrl(p.avatar);if(!src)src=m.avatar_url||m.picture||'';
  if(src)return `<img class="av-img ${cls}" src="${esc(src)}" alt="" referrerpolicy="no-referrer">`;
  const n=displayName();return n?`<span class="av-init ${cls}">${esc(n.slice(0,1).toUpperCase())}</span>`:`<span class="av-init guest ${cls}">${icon('user')}</span>`;
}
const STATUS_TXT={off:'',guest:'尚未登入 · 資料只存在這台裝置',unconfigured:'尚未登入 · 資料只存在這台裝置',ok:'已同步',syncing:'同步中…',offline:'離線中 · 連線後自動同步',error:'同步失敗',expired:'登入已過期，請重新登入'};
function syncText(){
  if(Cloud.status==='ok'&&Cloud.lastSync){const m=Math.round((Date.now()-Cloud.lastSync)/60000);return m<1?'已同步 · 剛剛':`已同步 · ${m} 分鐘前`}
  return STATUS_TXT[Cloud.status]||'';
}
async function renderTopbar(){
  const g=$('#tbGreet');if(!g)return;
  const h=new Date().getHours(),hi=h<5?'夜深了':h<11?'早安':h<14?'午安':h<18?'午後好':'晚安';
  const n=displayName();g.textContent=n?`${hi}，${n}`:hi;
  $('#tbSub').textContent=Cloud.uid||Cloud.user?syncText():STATUS_TXT.guest;
  $('#avatarIn').innerHTML=await avatarHTML();
  $('#syncDot').dataset.s=Cloud.status;
}
async function pickAvatar(file){
  try{const b=await cropImage(file,{aspect:1,circle:true,max:512,title:'裁剪頭像'});if(!b)return;const id='avatar_'+uid();await DB.put('blobs',id,b);const p=getProfile();if(p.avatar)dropBlob(p.avatar);p.avatar=id;save('settings');renderTopbar();accountHook&&accountHook()}
  catch(e){toast('圖片無法讀取')}
}

/* ---- 帳號頁 ---- */
const AUTH_ERR=m=>/Invalid login/i.test(m)?'Email 或密碼錯誤':/not confirmed/i.test(m)?'請先到信箱點確認連結':/already registered|already exists/i.test(m)?'這個 Email 已經註冊過，請直接登入':/at least 6|Password should/i.test(m)?'密碼至少要 6 個字元':/provider is not enabled|Unsupported provider/i.test(m)?'這個登入方式尚未在 Supabase 開啟':/rate limit/i.test(m)?'嘗試太多次，請稍後再試':m;
const redirectURL=()=>location.href.split('#')[0].split('?')[0];
function openAccount(){
  let tab='in';
  const s=openSheet({title:'個人資料',full:true,onClose:()=>{accountHook=null}});
  const B=s.body;
  const draw=async()=>{
    const cfg=cloudCfg();

      const u=Cloud.user,prov=(u.app_metadata&&u.app_metadata.provider)||'email';
      B.innerHTML=`<div class="acc-hero"><label class="av-xl">${await avatarHTML('xl')}<span class="av-edit">${icon('image')}</span><input type="file" accept="image/*" hidden id="avIn"></label>
          <b>${esc(displayName())}</b><small>${esc(u.email||'')} · ${prov==='google'?'Google':'Email'} 帳號</small></div>
        <div class="card sync-card"><i class="sync-dot" data-s="${Cloud.status}"></i><div><b>${esc(syncText())}</b>${Cloud.status==='error'?`<small>${esc(Cloud.err)}</small>`:'<small>日記、照片與設定會自動備份到你的帳號</small>'}</div><button class="pill" data-a="sync">${icon('repeat')}同步</button></div>
        <div class="sec-h mt"><h2>${icon('user')}個人設定</h2></div>
        <div class="card set-list">
          <div class="set-row"><span>顯示名稱</span><input class="inp sm" id="pfName" placeholder="你的名字" maxlength="20"></div>
          <button class="set-row" data-a="avatarDel"><span>頭像</span><em>${getProfile().avatar?'移除自訂頭像':'點上方頭像更換'}</em></button>
          <button class="set-row" data-a="metrics"><span>每日指數</span><em>${getMetrics().map(m=>m.name).join('、')||'未設定'}</em>${icon('chevR')}</button>
          <button class="set-row" data-a="fonts"><span>字型</span><em>${fontLabel()}</em>${icon('chevR')}</button>
          <button class="set-row" data-a="layout"><span>封面預設版型</span><em>${(LAYOUTS.find(l=>l[0]===(S.settings.coverLayout||'frame'))||LAYOUTS[0])[1]}</em>${icon('chevR')}</button>
          <button class="set-row" data-a="pdf"><span>匯出 PDF</span>${icon('chevR')}</button>
          <button class="set-row" data-a="backup"><span>備份與匯出</span>${icon('chevR')}</button>
        </div>
        <div class="sec-h mt"><h2>${icon('sliders')}帳號</h2></div>
        <div class="card set-list">
          ${prov==='email'?`<button class="set-row" data-a="pw"><span>修改密碼</span>${icon('chevR')}</button>`:''}
          <button class="set-row" data-a="logout"><span>登出</span>${icon('chevR')}</button>
          <button class="set-row danger" data-a="delete"><span>刪除帳號</span>${icon('trash')}</button>
        </div>`;
      const nm=$('#pfName',B);nm.value=getProfile().name||displayName();
      nm.oninput=()=>{getProfile().name=nm.value.trim();save('settings');renderTopbar();$('.acc-hero b',B).textContent=displayName()};
      $('#avIn',B).onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)pickAvatar(f)};
      return;
    }
    if(!cfg.url||!cfg.key){
      B.innerHTML=`<div class="acc-hero"><span class="av-xl">${await avatarHTML('xl')}</span><b>還沒有連接雲端</b><small>目前資料只存在這台裝置</small></div>
        <div class="card"><p class="hint" style="margin-bottom:12px">要啟用註冊 / 登入與雲端資料庫，請先建立免費的 Supabase 專案，並貼上專案的 <b>Project URL</b> 和 <b>anon public key</b>（在 Supabase：Project Settings → API）。</p>
          <div class="field"><span class="label">Project URL</span><input class="inp" id="sbUrl" placeholder="https://xxxx.supabase.co" inputmode="url"></div>
          <div class="field"><span class="label">anon public key</span><input class="inp" id="sbKey" placeholder="eyJhbGciOi…"></div>
          <button class="btn btn-p btn-block" data-a="cfg">${icon('link')}儲存並連線</button></div>
        <button class="btn btn-g btn-block mt" data-a="backup">${icon('download')}備份與匯出</button>`;
      return;
    }
    const expired=Cloud.status==='expired';
    B.innerHTML=`<div class="acc-hero"><span class="av-xl">${await avatarHTML('xl')}</span><b>${expired?'請重新登入':'登入你的手帳'}</b><small>${expired?'登入後會繼續同步這台裝置上的資料':'登入後資料會同步到你的帳號，換手機也不會遺失'}</small></div>

        <div class="field"><span class="label">密碼</span><input class="inp" id="auPw" type="password" autocomplete="${tab==='up'?'new-password':'current-password'}" placeholder="${tab==='up'?'至少 6 個字元':'••••••'}"></div>
        <button class="btn btn-p btn-block" type="submit">${tab==='up'?'註冊':'登入'}</button>
        ${tab==='in'?'<button type="button" class="link-btn" data-a="forgot">忘記密碼？</button>':''}
      </form>
      <button class="link-btn mt" data-a="cfgEdit">連線設定</button>`;
    $('#authForm',B).onsubmit=async e=>{
      e.preventDefault();const email=$('#auEmail',B).value.trim(),pw=$('#auPw',B).value;
      if(!email||!pw){toast('請輸入 Email 和密碼');return}
      const btn=$('[type=submit]',B);btn.disabled=true;
      try{
        if(tab==='up'){
          const name=$('#auName',B).value.trim();
          const{data,error}=await Cloud.sb.auth.signUp({email,password:pw,options:{data:{name},emailRedirectTo:redirectURL()}});
          if(error)throw error;
          if(!data.session)toast('確認信已寄出，請到信箱點連結完成註冊');
        }else{const{error}=await Cloud.sb.auth.signInWithPassword({email,password:pw});if(error)throw error}

/* ---------- 黑白：列印不吃 CSS 濾鏡，所以先把漸層與照片轉成灰階 ---------- */
const grayHex=h=>{if(h.length===4)h='#'+[...h.slice(1)].map(c=>c+c).join('');
  const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  const l=Math.round(Math.max(0,Math.min(255,(.299*r+.587*g+.114*b-128)*1.06+128))).toString(16).padStart(2,'0');return '#'+l+l+l};
const grayCss=s=>s.replace(/#[0-9a-f]{6}\b|#[0-9a-f]{3}\b/gi,grayHex);
const printUrls=[];
function grayImg(url){return new Promise(res=>{const im=new Image();
  im.onload=()=>{try{const sc=Math.min(1,2000/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.naturalWidth*sc));c.height=Math.max(1,Math.round(im.naturalHeight*sc));
    const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),p=d.data;
    for(let i=0;i<p.length;i+=4)p[i]=p[i+1]=p[i+2]=(.299*p[i]+.587*p[i+1]+.114*p[i+2]-128)*1.06+128;
    x.putImageData(d,0,0);c.toBlob(b=>{if(!b)return res(url);const u=URL.createObjectURL(b);printUrls.push(u);res(u)},'image/jpeg',.92)}catch(e){res(url)}};
  im.onerror=()=>res(url);im.src=url})}

async function shotFontCss(root){
  const c=fontChoice(),fams=[...new Set([c.ui,c.head])];
  const chars=[...new Set([...(root.textContent+'我允許自己（續）APPROVED准')].filter(ch=>/\S/.test(ch)))];
  let css='';
  for(const f of fams)for(let i=0;i<chars.length;i+=350){
    const chunk=chars.slice(i,i+350),range=chunk.map(ch=>'U+'+ch.codePointAt(0).toString(16)).join(',');
    let t='';try{const r=await fetch(gfUrl([f],chunk.join('')));if(r.ok)t=await r.text()}catch(e){}
    for(const blk of t.match(/@font-face\s*{[^}]*}/g)||[]){
      const m=blk.match(/url\(([^)]+)\)/);if(!m)continue;
      let du='';try{const r=await fetch(m[1].replace(/['"]/g,''));if(r.ok)du=await toDataUrl(await r.blob())}catch(e){}
      if(!du)continue;
      let b=blk.replace(m[0],`url(${du})`);if(!/unicode-range/.test(b))b=b.replace(/}\s*$/,`unicode-range:${range};}`);
      css+=b+'\n';
    }
  }
  return css;
}

/* ---------- 自動分頁 ---------- */
function ppPage(P,foot){
  P.insertAdjacentHTML('beforeend',`<section class="pp pp-doc"><div class="pp-in"></div><div class="pp-foot"><span>MY JOURNAL</span><span>${foot}<i class="pp-no"></i></span></div></section>`);
  return P.lastElementChild.firstElementChild;
}
function ppFits(inner){const l=inner.lastElementChild;return !l||l.getBoundingClientRect().bottom<=inner.getBoundingClientRect().bottom+.5}
// 把放不下的區塊切成「這頁放得下的部分」和「剩下的部分」；完全切不了回傳 false，其實放得下回傳 null
function ppSplit(node,inner){
  const t=[...node.children].find(c=>c.dataset&&c.dataset.split);if(!t)return false;
  const fits=()=>ppFits(inner),after=[];
  for(let s=t.nextElementSibling;s;s=s.nextElementSibling)after.push(s);
  after.forEach(a=>a.remove());
  const rest=node.cloneNode(false),h=node.querySelector(':scope>h3'),tc=t.cloneNode(false);
  rest.classList.add('pp-cont');if(h)rest.append(h.cloneNode(true));rest.append(tc);
  const undo=()=>{after.forEach(a=>node.append(a));return false};
  if(t.dataset.split==='text'){
    const full=t.textContent;let lo=0,hi=full.length;
    while(lo<hi){const mid=(lo+hi+1)>>1;t.textContent=full.slice(0,mid);if(fits())lo=mid;else hi=mid-1}
    let k=lo;
    if(k<full.length){const nl=full.lastIndexOf('\n',k);if(nl>k-80&&nl>0)k=nl;else if(/[A-Za-z0-9]/.test(full[k]||'')){const sp=full.lastIndexOf(' ',k);if(sp>k-30&&sp>0)k=sp}}
    if(k<full.length&&k<12){t.textContent=full;return undo()}
    t.textContent=full.slice(0,k).replace(/\s+$/,'');tc.textContent=full.slice(k).replace(/^\s+/,'');
  }else{
    const items=[...t.children];let n=items.length;
    while(n>0&&!fits()){t.lastElementChild.remove();n--}
    if(n===0){items.forEach(i=>t.append(i));return undo()}
    items.slice(n).forEach(i=>tc.append(i));
  }
  if(!tc.textContent.trim()&&!tc.children.length)tc.remove();
  after.forEach(a=>rest.append(a));
  if(rest.children.length<=(h?1:0))return null;
  return rest;
}
function paginate(P,sec){
  let inner=ppPage(P,sec.foot);
  const tpl=document.createElement('template');
  for(const html of sec.blocks){
    tpl.innerHTML=html.trim();let node=tpl.content.firstElementChild;if(!node)continue;
    inner.append(node);
    for(let guard=0;guard<80&&!ppFits(inner);guard++){
      const rest=ppSplit(node,inner);
      if(rest===null)break;
      if(rest===false){
        if(inner.firstElementChild===node)break; // 一整頁都放不下又切不開：留在這頁
        node.remove();inner=ppPage(P,sec.foot);inner.append(node);continue;
      }
      inner=ppPage(P,sec.foot);node=rest;inner.append(node);
    }
  }
}

let ppScrollY=0;
async function buildPrint(level,date){
  let root=$('#printRoot');if(!root){root=document.createElement('div');root.id='printRoot';document.body.append(root)}
  const d=parseYmd(date),y=d.getFullYear(),m=d.getMonth(),cfg=coverCfg(y,m);
  ppScrollY=window.scrollY;
  root.style.removeProperty('--ppz');
  root.innerHTML=`<div class="pp-tools"><button class="pill" data-pp="back">${icon('chevL')}返回</button><div class="grow"><b>預覽</b><span id="ppInfo">排版中…</span></div><button class="btn btn-g" data-pp="jpg">JPG</button><button class="btn btn-p" data-pp="print">${icon('download')}PDF</button></div><div class="pp-pages"></div>`;
  document.documentElement.classList.add('printing');window.scrollTo(0,0);ppZoom();
  const P=$('.pp-pages',root);root.dataset.date=date;
  if(level===0||level>=4){P.insertAdjacentHTML('beforeend',pdfYearCover(y));await Promise.all($$('.yc-art',P.lastElementChild).map(a=>paintArtEl(a,coverCfg(y,+a.dataset.m),+a.dataset.m)))}
  if(level>=1){
    P.insertAdjacentHTML('beforeend',`<section class="pp pp-cover">${coverHTML(y,m,cfg.layout)}</section>`);
    fitCover(P);
    await paintPrintCover(P.lastElementChild,cfg,m);
  }
  const secs=[];if(level>=2)secs.push(pdfDiary(date));if(level>=3)secs.push(pdfMonth(y,m));if(level>=4)secs.push(pdfYear(y));
  if(secs.length){
    // 先整份排一次，讓瀏覽器載入需要的字型，量高度才準
    const st=document.createElement('section');st.className='pp pp-doc pp-stage';st.innerHTML='<div class="pp-in">'+secs.map(s=>s.blocks.join('')).join('')+'</div>';
    P.append(st);void st.offsetHeight;try{await document.fonts.ready}catch(e){}
    st.remove();
    for(const s of secs)paginate(P,s);
  }
  await Promise.all($$('img[data-blob]',P).map(async im=>{const u=await blobUrl(im.dataset.blob);if(u)im.src=u;try{await im.decode()}catch(e){}}));
  // 列印時半透明漸層容易變成黑色，改成實色
  $$('path[fill^="url(#"]',P).forEach(p=>{const id=p.getAttribute('fill').slice(5,-1),st=P.querySelector(`[id="${id}"] stop`);p.setAttribute('fill',st?st.getAttribute('stop-color'):'#b5724a');p.setAttribute('fill-opacity','.1')});
  const pages=$$('.pp',P);pages.forEach((p,i)=>{const n=$('.pp-no',p);if(n)n.textContent=' · '+pad(i+1)});
  $('#ppInfo').textContent=`A4 · 共 ${pages.length} 頁`;
  ppZoom();
  return pages.length;
}
function ppZoom(){const r=$('#printRoot');if(r&&document.documentElement.classList.contains('printing'))r.style.setProperty('--ppz',Math.min(1,(window.innerWidth-24)/794).toFixed(4))}

  const was=document.documentElement.classList.contains('printing');

    try{ms.setActionHandler('play',()=>{if(!PS.playing)togglePlay()});ms.setActionHandler('pause',()=>{if(PS.playing)togglePlay()});ms.setActionHandler('nexttrack',()=>nextTrack(1));ms.setActionHandler('previoustrack',()=>nextTrack(-1))}catch(e){}
  }
  document.addEventListener('visibilitychange',()=>{if(document.hidden)flushAll()});
  window.addEventListener('pagehide',()=>flushAll());
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

  applyFonts();
  let tab='cal';try{tab=localStorage.getItem('techou.tab')||'cal'}catch(e){}
  go(renders[tab]?tab:'cal');
  $('#avatarBtn').onclick=openAccount;
  renderTopbar();setInterval(renderTopbar,60000);
  Cloud.init();
}
init();
</script>
</body>
